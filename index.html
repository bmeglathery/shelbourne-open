<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Is Shelbourne Open?</title>
  <style>
    html, body { height: 100%; margin: 0; }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      background: gray;
      color: yellow;
      font-family: system-ui, sans-serif;
    }
    h1 {
      margin: 0 0 1rem;
      font-size: clamp(2rem, 8vw, 5rem); /* scales with window size */
    }
    p { margin: 0; }
  </style>
</head>
<body>
  <h1>Shelbourne is OPEN</h1>
  <h2>Not sure if they're on lunch and coming back, or done for the day, but traffic is freely moving, no workers in sight</h2>
  <p>Last Updated: <span id="last-updated"></span></p>
  <script>
    document.getElementById('last-updated').textContent = document.lastModified;
  </script>
</body>
</html>
